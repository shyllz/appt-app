<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Home</title>
  <meta name="theme-color" content="#2f5d50">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Home">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app"><div class="center muted">Loading…</div></div>
  <dialog id="dlg">
    <form method="dialog" id="dlg-form">
      <h2 id="dlg-title"></h2>
      <input id="dlg-input" autocomplete="off" maxlength="60">
      <div class="dlg-actions">
        <button type="button" class="btn" onclick="this.closest('dialog').close('cancel')">Cancel</button>
        <button value="ok" class="btn primary" id="dlg-ok">Save</button>
      </div>
    </form>
  </dialog>
  <div id="toast" role="status"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
